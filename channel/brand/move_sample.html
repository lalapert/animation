<!doctype html><html><head><meta charset="utf-8"><title>Movement sample (waist-up, cover, hops)</title><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="toon.js"></script><script src="lab.js"></script><script src="vmkit.js"></script><script src="labkit.js"></script><script src="travel.js"></script><script src="sets.js"></script>
<script>
// Sample, no voice. Shot 1 (lab): Vera strides along behind the bench, waist-up, the camera follows; Cleo turns her head to watch.
// Shot 2 (Void Mart aisle): Rae walks down the aisle behind the shelf; Pip hops after her: only her head pops up over the shelf.
const g = document.getElementById('c').getContext('2d'); window.DUR = 8.0;
const CUT = 3.4, sm = (a, b, t) => ease(clamp((t - a) / (b - a)));
function shotLab(t) {
  const STEP = 150, T = travel(t, .3, 100, 640, STEP), bob = walkBob(T.dist, STEP, 12);
  const camX = 540 + (T.x - 400) * .55;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#12302a'; g.fillRect(0, 0, 1080, 1920);
  const z = 1.45; g.setTransform(z, 0, 0, z, 540 - camX * z, 960 - 1000 * z);
  g.drawImage(LAB_STATIC.lab, 0, 0); drawWindow(g, t, 0); drawRentCircles(g, 4); drawFridge(g, 0);
  drawCleo2(g, CLEO.x + 150, LCT, CLEO.s, { expr: 'deadpan', look: clamp((T.x - CLEO.x - 150) / 300, -1, 0) * 2.5, blink: blinkAt(1, t) });
  if (T.moving || t < .3) drawTraveller(g, (gg, x, y, s, o) => drawVera2(gg, x, y, s, o), T.x, LCT + 6, VERA.s, { expr: 'scheme', blink: blinkAt(0, t) }, T.moving ? bob : { dy: 0, rot: 0, swing: 0 }, 1);
  else drawVera2(g, T.x, LCT, VERA.s, { expr: 'cool', tube: false, blink: blinkAt(0, t) });
  g.drawImage(LAB_STATIC.front, 0, LCT);
}
function shotAisle(t) {
  const u = t - CUT, STEP = 160, R = travel(u, .2, 1500, 420, STEP), bob = walkBob(R.dist, STEP, 12);
  const P = travel(u, .9, 1820, 820, 150, 2.4), hp = hopPose(P.dist / 150, 150);
  const camX = clamp((R.x + P.x) / 2 + 20, 540, AISLE.w - 540);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#221a4f'; g.fillRect(0, 0, 1080, 1920);
  const z = 1.12; g.setTransform(z, 0, 0, z, 540 - camX * z, 960 - 1040 * z);
  g.drawImage(AISLE.back, 0, 0);
  drawTraveller(g, (gg, x, y, s, o) => drawRae2(gg, x, y, s, o), R.x, AISLE.top + 40, 190, { expr: 'deadpan', scanner: false, blink: blinkAt(2, t) }, R.moving ? bob : { dy: 0, rot: 0, swing: 0 }, -1);
  // Pip, shorter: her waist is far below the shelf top, so only her head shows, except at the top of each hop
  g.save(); g.translate(P.x, AISLE.top + 300 + (P.moving ? hp.dy : 0)); g.scale(P.moving ? hp.sx : 1, P.moving ? hp.sy : 1);
  drawPip2(g, 0, 0, 190, { expr: 'grin', turn: -.7, blink: blinkAt(3, t), armsDown: { l: P.moving && !hp.ground ? -30 : 0, r: P.moving && !hp.ground ? 30 : 0, bend: P.moving && !hp.ground ? .6 : 0 } });
  g.restore();
  g.drawImage(AISLE.front, 0, AISLE.top);
}
window.render = t => { if (t < CUT) shotLab(t); else shotAisle(t); };
(async () => { await toonFonts('fonts/'); buildLab(); buildStore(); buildAisle(); render(0); window.READY = true; })();
</script></body></html>
