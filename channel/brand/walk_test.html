<!doctype html><html><head><meta charset="utf-8"><title>Walk test</title><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="toon.js"></script><script src="lab.js"></script><script src="vmkit.js"></script><script src="labkit.js"></script><script src="bodies.js"></script>
<script>
// walk cycle check: Vera walks, Cleo runs, across a floor with tick marks (planted feet must not slide over the marks)
const g = document.getElementById('c').getContext('2d'); window.DUR = 4;
window.render = t => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#e9eef4'; g.fillRect(0, 0, 1080, 1920);
  for (const y of [900, 1800]) { g.fillStyle = '#c4ccd8'; g.fillRect(0, y, 1080, 120); for (let x = 0; x < 1080; x += 60) { g.fillStyle = '#9aa4b4'; g.fillRect(x, y, 3, 20); } }
  const W = walkTo('vera', 'walk', t, 0, 120, 1000, 100);
  drawFull('vera', g, W.x, 900, 100, { act: 'walk', dist: W.dist, dir: 1, expr: 'cool' });
  const R = walkTo('cleo', 'run', t, 0, 980, 60, 100);
  drawFull('cleo', g, R.x, 1800, 100, { act: 'run', dist: R.dist, dir: -1, expr: 'deadpan' });
};
(async () => { await toonFonts('fonts/'); render(0); window.READY = true; })();
</script></body></html>
