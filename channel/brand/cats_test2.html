<!doctype html><html><head><meta charset="utf-8"><title>Cat sheet 2</title><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="toon.js"></script><script src="lab.js"></script><script src="vmkit.js"></script><script src="labkit.js"></script>
<script>
const g = document.getElementById('c').getContext('2d');
(async () => { await toonFonts('fonts/');
g.fillStyle = '#21463c'; g.fillRect(0, 0, 1080, 1920);
drawCat(g, 330, 450, 380, { fur: 'ginger', pose: 'crouch', pupil: 1, wiggle: .25 });
drawCat(g, 600, 950, 380, { fur: 'tux', pose: 'run', pupil: 1, phase: .2, rot: -.25 });
drawCatPressed(g, 540, 1450, 220, { fur: 'ginger', pupil: .9 });
window.READY = true; })();
</script></body></html>
