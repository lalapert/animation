<!doctype html><html><head><meta charset="utf-8"><title>Monster options</title><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="2340" height="1500"></canvas>
<script src="tapekit.js"></script>
<script>
// B as a monochrome monster (owner 11/12): three looks, each clean, behind Leon on CAM 09, and at the lens. Same "no face" rule.
'use strict';
const OUT = document.getElementById('c').getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const RAW = mk(TK.TW, TK.TH), WIN = mk(TK.TW, TK.TH);
const CAM = { x: 3.6, y: 4.2, z: .4, yaw: -.1, pitch: -.36, fov: 80 }, CAMC = { x: .3, y: 1.55, z: 2.2, yaw: .05, pitch: .02, fov: 50 };
const V = [['cracked', 'A  CRACKED', 'a broken mannequin, too tall: a black hollow where the face was'], ['hollow', 'B  HOLLOW', 'too thin, porcelain cracks, head hanging sideways'], ['smear', 'C  SMEAR', 'a suit; the head is a streak, it moved too fast']];
function card(g, x0, y0, W, H, v, lab, note) {
  g.save(); g.translate(x0, y0); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#3a3a3e'); bg.addColorStop(1, '#1c1c20'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const u = (H - 110) / 2.3; g.save(); g.translate(W / 2, H - 20); g.scale(u, u); TK.ghost._draw(g, v, { light: 1, seed: 3, armR: v === 'cracked' ? .25 : 0, neck: v === 'hollow' ? .05 : .08 }); g.restore();
  g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, W, 80); g.fillStyle = '#efe9da'; g.font = '34px "Special Elite"'; g.fillText(lab, 16, 36); g.font = '25px "VT323"'; g.fillStyle = 'rgba(239,233,218,.8)'; g.fillText(note, 16, 66);
  g.restore();
}
function tape(v, close) {
  const rg = RAW.getContext('2d');
  if (!close) {
    const S = TK.concourse({ lightsOn: z => (z % 12 === 3 ? .9 : 0) });
    TK.render(rg, S, CAM, { ambient: .9, fog: .06, sprites: [{ x: .4, z: 9, draw: (g, c) => TK.ghost(g, c, v, .4, 9, { ambient: 1.1, seed: 5, armR: .3 }) }] });
  } else {
    const S = TK.concourse({ lightsOn: z => (z % 12 === 3 ? .9 : 0) });
    TK.render(rg, S, CAMC, { ambient: .5, fog: .08, sprites: [{ x: .35, z: 3.35, draw: (g, c) => TK.ghost(g, c, v, .35, 3.35, { ambient: 1.3, seed: 9, armR: .9, armL: .9, neck: .1 }) }] });
  }
  const wg = WIN.getContext('2d'); TK.grade(wg, RAW, 1, 'cctv'); TK.vhs(wg, 1, 1, 3); TK.osd(wg, 'cctv', 1, { cam: 'CAM 01', place: 'MAIN CONCOURSE', stamp: '12-31-1999  23:58:41' });
  return WIN;
}
(async () => {
  await TK.fonts('fonts/');
  const PW = 560, PH = 420, G = 20;
  OUT.fillStyle = '#0b0b0d'; OUT.fillRect(0, 0, 2340, 1500);
  OUT.font = '44px "Special Elite"'; OUT.fillStyle = '#efe9da'; OUT.fillText('B AS A MONOCHROME MONSTER', G, 56);
  OUT.font = '30px "VT323"'; OUT.fillStyle = 'rgba(239,233,218,.7)'; ['DESIGN', 'CCTV, DOWN THE CORRIDOR', 'CLOSE (THE JUMP)'].forEach((s, i) => OUT.fillText(s, G + i * (PW + G) + (i ? 0 : 0), 100));
  V.forEach(([v, lab, note], r) => {
    const y = 120 + r * (PH + G);
    card(OUT, G, y, PW, PH, v, lab, note);
    OUT.drawImage(tape(v, false), G + (PW + G), y, PW, PH);
    OUT.drawImage(tape(v, true), G + 2 * (PW + G), y, PW, PH);
  });
  window.READY = true;
})();
</script></body></html>
