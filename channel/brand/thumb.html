<!doctype html><html><head><meta charset="utf-8"><title>Thumbnail compositor</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="toon.js"></script><script src="inserts.js"></script>
<script>
// Cover / thumbnail for a Short or Reel: 1080 x 1920. Everything that matters stays inside the middle 3:4 band
// (y 240..1680), which is what the Instagram profile grid shows. compose(spec, frameDataURL) → window.OUT (jpeg data URL)
const g = document.getElementById('c').getContext('2d');
const COL = { vm: { hl: '#ffb066', pill: '#ff7a1a', pillText: '#1a1030', name: 'VOID MART' }, vl: { hl: '#d8ff7a', pill: '#b6ff3b', pillText: '#13261c', name: 'VOLT LABS' } };
function img(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
function bigText(lines, hl, col, y0, size) {
  g.save(); g.translate(540, y0); g.rotate(-.035);
  g.font = `${size}px "Bungee"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  lines.forEach((ln, i) => {
    let s = size; g.font = `${s}px "Bungee"`; while (g.measureText(ln).width > 980 && s > 60) { s -= 4; g.font = `${s}px "Bungee"`; }
    const y = i * size * 1.08, words = ln.split(' '), W = g.measureText(ln).width; let x = -W / 2;
    for (const w of words) {
      const ww = g.measureText(w + ' ').width, cx = x + g.measureText(w).width / 2;
      g.lineWidth = s * .2; g.strokeStyle = '#140a24'; g.strokeText(w, cx, y + 8);           // drop
      g.strokeText(w, cx, y); g.fillStyle = hl.includes(w.replace(/[^A-Z']/g, '')) ? col : '#ffffff'; g.fillText(w, cx, y);
      x += ww;
    }
  });
  g.restore();
}
async function toon(spec, frame) {
  const im = await img(frame), z = spec.zoom || 1, [fx, fy] = spec.focus || [540, 900], [px, py] = spec.place || [540, 1020];
  g.fillStyle = '#120a2a'; g.fillRect(0, 0, 1080, 1920);
  g.drawImage(im, px - fx * z, py - fy * z, 1080 * z, 1920 * z);
  const tg = g.createLinearGradient(0, 180, 0, 760); tg.addColorStop(0, 'rgba(18,8,40,.82)'); tg.addColorStop(.75, 'rgba(18,8,40,.45)'); tg.addColorStop(1, 'rgba(18,8,40,0)');
  g.fillStyle = tg; g.fillRect(0, 0, 1080, 760);
  const c = COL[spec.series];
  bigText(spec.lines, spec.hl || [], c.hl, 390, spec.size || 112);
  // series pill
  g.save(); g.font = '40px "Bungee"'; const label = `${c.name}  ·  EP ${spec.ep}`, w = g.measureText(label).width + 70;
  g.fillStyle = 'rgba(20,10,36,.85)'; g.beginPath(); g.roundRect(540 - w / 2 - 6, 1560 - 6, w + 12, 96, 48); g.fill();
  g.fillStyle = c.pill; g.beginPath(); g.roundRect(540 - w / 2, 1560, w, 84, 42); g.fill();
  g.fillStyle = c.pillText; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, 540, 1604); g.restore();
}
async function tape(spec, frame) {
  // the CCTV picture of the archive viewer (source y 518..1332), zoomed onto the anomaly, inside the band y 470..1490
  const im = await img(frame), sy = 518, sh = 814, z = spec.zoom || 1, k = 1020 / sh * z, [fx, fy] = spec.focus || [540, 925];
  g.fillStyle = '#060606'; g.fillRect(0, 0, 1080, 1920);
  g.save(); g.beginPath(); g.rect(0, 470, 1080, 1020); g.clip();
  let dx = 540 - fx * k, dy = 980 - (fy - sy) * k;
  dx = Math.min(0, Math.max(1080 - 1080 * k, dx)); dy = Math.min(470, Math.max(1490 - sh * k, dy));
  g.drawImage(im, 0, sy, 1080, sh, dx, dy, 1080 * k, sh * k);
  g.fillStyle = 'rgba(0,0,0,.16)'; for (let y = 470; y < 1490; y += 4) g.fillRect(0, y, 1080, 1.5);     // scanlines
  const vg = g.createRadialGradient(540, 980, 300, 540, 980, 760); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = vg; g.fillRect(0, 470, 1080, 1020);
  g.restore();
  // top: STILL RECORDING, tape label with REC
  insText(g, 'STILL RECORDING', 540, 300, 34, 'rgba(242,242,234,.7)', '"VT323"', 'center');
  g.fillStyle = '#ff2a2a'; g.beginPath(); g.arc(250, 390, 22, 0, 6.2832); g.fill();
  insText(g, spec.tape, 290, 392, 120, '#f2f2ea', '"VT323"');
  // bottom: the hook
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '86px "SpecialElite"'; g.lineWidth = 12; g.strokeStyle = '#000'; g.lineJoin = 'round';
  spec.lines.forEach((ln, i) => { g.strokeText(ln, 540, 1560 + i * 92); g.fillStyle = '#f2f2ea'; g.fillText(ln, 540, 1560 + i * 92); });
  g.restore();
}
window.compose = async (spec, frame) => { await (spec.series === 'sr' ? tape(spec, frame) : toon(spec, frame)); window.OUT = document.getElementById('c').toDataURL('image/jpeg', .9); return true; };
Promise.all([toonFonts(), insFonts('fonts/')]).then(() => { window.READY = true; });
</script></body></html>
