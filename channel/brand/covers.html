<!doctype html>
<html><head><meta charset="utf-8"><title>Drawn covers</title><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>window.TL = { DUR: 1, VO: [], SHOTS: [] }; window.CHARS = {};</script>
<script src="toon.js"></script><script src="lab.js"></script><script src="vmkit.js"></script><script src="labkit.js"></script><script src="cover.js"></script>
<script>
(async () => {
  try {
    const ep = new URLSearchParams(location.search).get('ep');
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'covers/' + ep + '.js'; s.onload = ok; s.onerror = () => no(new Error('no cover scene for ' + ep)); document.body.appendChild(s); });
    await toonFonts('fonts/');
    const g = document.getElementById('c').getContext('2d'); COVER[ep](g); window.READY = true;
  } catch (e) { window.INIT_ERROR = String(e && e.stack || e); }
})();
</script></body></html>
