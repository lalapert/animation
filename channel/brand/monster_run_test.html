<!doctype html><html><head><meta charset="utf-8"><title>Run test</title><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="810"></canvas>
<script src="tapekit.js"></script>
<script>
// 4 s per design: it stands against the lit doorway, the head snaps, then it comes down the corridor in held 6 fps jumps
const OUT = document.getElementById('c').getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const RAW = mk(TK.TW, TK.TH);
const FIT = (() => { const S = new TK.Scene(); const H = 2.8, wall = [150, 146, 140];
  for (let z = 0; z < 12; z += 1) { S.quad([[-1.6, 0, z], [1.6, 0, z], [1.6, 0, z + 1], [-1.6, 0, z + 1]], [120, 116, 110], { floor: true }); S.quad([[-1.6, H, z + 1], [1.6, H, z + 1], [1.6, H, z], [-1.6, H, z]], [90, 88, 84]); }
  S.quad([[-1.6, 0, 12], [1.6, 0, 12], [1.6, H, 12], [-1.6, H, 12]], [200, 200, 196], { emit: .9 });
  S.quad([[-1.6, 0, 12], [-1.6, 0, 0], [-1.6, H, 0], [-1.6, H, 12]], wall); S.quad([[1.6, 0, 0], [1.6, 0, 12], [1.6, H, 12], [1.6, H, 0]], wall.map(v => v * .85));
  for (let z = 2; z < 12; z += 3) S.quad([[-.4, H - .02, z], [.4, H - .02, z], [.4, H - .02, z + .5], [-.4, H - .02, z + .5]], [150, 150, 140], { emit: .5, light: true });
  return S; })();
const CAM = { x: .9, y: 2.45, z: .4, yaw: -.08, pitch: -.16, fov: 64 };
window.render = t => {
  const kind = ['crane', 'broken', 'reverse'][Math.min(2, Math.floor(t / 4))], tt = t % 4, tq = Math.floor(tt * 6) / 6;
  const run = Math.pow(TK.clamp((tq - 1.8) / 1.6), 1.7), z = 10.5 - run * 9.0, x = -.15 + run * .5;
  const tilt = TK.motion.snap(tq, 1.2, 0, kind === 'broken' ? .35 : -.5);
  TK.render(RAW.getContext('2d'), FIT, CAM, { ambient: .75, fog: .07, sprites: [{ x, z, draw: (g, c) => TK.ghost(g, c, kind, x, z, { tilt, charge: run > 0 ? Math.min(1, run * 3) : 0, armR: run > .8 ? .4 : 0 }) }] });
  TK.grade(OUT, RAW, tq, 'cctv'); TK.vhs(OUT, tq, run > .9 ? 2.5 : 1, 3);
  TK.osd(OUT, 'cctv', tt, { cam: 'CAM 09', place: 'SERVICE HALL', stamp: '12-01-1999  01:43:' + String(12 + Math.floor(tt)).padStart(2, '0') });
};
TK.fonts('fonts/').then(() => { window.render(0); window.READY = true; });
</script></body></html>
